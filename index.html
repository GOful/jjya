<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>일일업무일지 생성기</title>
<style>
:root{font-family:system-ui,-apple-system,"맑은 고딕",sans-serif;color:#213649;background:#f4f6f8;font-synthesis:none}
*{box-sizing:border-box}body{margin:0}main{max-width:1240px;margin:32px auto;padding:0 24px 24px}header{margin-bottom:24px}h1{font-size:26px;letter-spacing:-1px;margin:0}h2{display:flex;align-items:center;gap:10px;font-size:17px;margin:0 0 20px;letter-spacing:-.4px}.step{display:inline-grid;place-items:center;width:27px;height:27px;border-radius:8px;background:#edf4f1;color:#246957;font-size:13px;font-weight:700;flex-shrink:0}
.card{background:#fff;border:1px solid #e0e6eb;border-radius:14px;padding:22px;margin-top:18px;box-shadow:0 2px 6px #25394b03;min-width:0}.inspection-columns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}.inspection-columns>.card{margin:0}.bar{margin-bottom:18px;min-width:0}.training-toolbar{display:grid;grid-template-columns:minmax(120px,180px)}.inspection-toolbar{display:grid;grid-template-columns:minmax(0,1.4fr) repeat(2,minmax(0,1fr));gap:10px}.field{display:flex;flex-direction:column;gap:7px;min-width:0}.field>span{font-size:12px;font-weight:600;color:#6b7c89}
input,select,button,textarea{font:inherit}select,input[type=date]{width:100%;min-width:0;height:40px;border:1px solid #d5dfe6;border-radius:7px;padding:0 9px;background:#fff;color:#263e50;font-size:13px}input[type=date]{font-size:12px;padding:0 6px}button{cursor:pointer}button:disabled{opacity:.5;cursor:default}button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #7cbca9;outline-offset:2px}
.table-wrap{height:350px;overflow:auto;border:1px solid #e2e8ed;border-radius:9px;scrollbar-width:thin;scrollbar-color:#cad6de transparent}table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:13px;line-height:1.6}th{white-space:nowrap;position:sticky;top:0;z-index:1;background:#f4f7f9;color:#6b7c89;text-align:left;font-size:12px;font-weight:600}td,th{padding:11px 12px;border-bottom:1px solid #edf0f3;vertical-align:middle}th:first-child,td:first-child{width:76px;color:#6b7c89;font-size:12px;overflow-wrap:anywhere}th:last-child,td:last-child{width:68px;text-align:center;white-space:nowrap;font-variant-numeric:tabular-nums}.inspection-columns>.card:nth-child(2) th:first-child,.inspection-columns>.card:nth-child(2) td:first-child{width:44px;text-align:center}.item{display:block;width:100%;padding:0;background:none;border:0;color:#2d4557;text-align:left;font-weight:400;line-height:1.7;overflow-wrap:anywhere}.item:hover{color:#176654}tbody tr:hover{background:#f6faf8}tr.selected{background:#edf7f2}tr.selected .item{color:#176654;font-weight:600}
#risk-selected,#inspection-selected,#misc-selected{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}#risk-selected:empty,#inspection-selected:empty,#misc-selected:empty,#inspection-status:empty,#misc-status:empty{display:none}.selection-chip{display:inline-flex;align-items:center;gap:8px;max-width:100%;padding:7px 10px;border-radius:7px;background:#edf7f2;font-size:12px;line-height:1.6;color:#24634f}.selection-chip span{overflow-wrap:anywhere}.remove-selection{flex-shrink:0;display:grid;place-items:center;width:26px;height:26px;padding:0;border:0;border-radius:5px;background:transparent;color:#4c7e6d;font-size:21px;line-height:1}.remove-selection:hover{background:#d7ece2}
#misc-items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}#misc-items button{display:flex;align-items:center;gap:10px;text-align:left;padding:12px 14px;border:1px solid #e0e6eb;border-radius:8px;background:#fff;color:#2d4557;font-size:13px;line-height:1.5;min-height:46px}#misc-items button:hover{border-color:#a9c8bb;background:#f7fbf9}#misc-items button.selected{background:#edf7f2;border-color:#8cbba7;color:#176654}#misc-items .number{font-size:12px;color:#8998a3;font-variant-numeric:tabular-nums}
textarea{display:block;width:100%;min-height:310px;padding:18px;border:1px solid #dce4ea;border-radius:9px;resize:vertical;line-height:1.9;font-size:14px;color:#2d4557;background:#fcfdfd}.actions{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:16px}#copy{padding:10px 28px;border:0;border-radius:7px;background:#176654;color:white;font-weight:600;font-size:14px;min-height:42px}#copy:hover:not(:disabled){background:#104e40}#status{font-size:12px;color:#6b7c89;line-height:1.6}#notice,#inspection-status,#misc-status{font-size:13px;line-height:1.7;color:#a1432e}#notice{margin-bottom:12px}
@media(max-width:1000px) and (min-width:821px){.inspection-toolbar{gap:6px;grid-template-columns:minmax(0,1.15fr) repeat(2,minmax(0,1fr))}.card{padding:18px}td,th{padding:10px 8px}}
@media(max-width:820px){.inspection-columns{grid-template-columns:1fr;gap:16px}.inspection-toolbar{grid-template-columns:minmax(0,1.4fr) repeat(2,minmax(0,1fr))}main{padding:0 16px 20px;margin-top:24px}.card{padding:18px;margin-top:16px}.table-wrap{height:310px}#misc-items{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:480px){h1{font-size:23px}h2{font-size:16px;margin-bottom:16px}main{padding:0 12px 16px}.card{padding:16px}.inspection-toolbar{grid-template-columns:repeat(2,minmax(0,1fr))}.inspection-toolbar .field:first-child{grid-column:1/-1}.training-toolbar{grid-template-columns:1fr}#misc-items button{padding:10px;font-size:12px;gap:7px}td,th{padding:10px 8px}th:first-child,td:first-child{width:66px}textarea{padding:12px;font-size:13px;min-height:340px}}
.work-columns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:18px;align-items:start}.work-columns>.card{margin-top:0}.work-columns textarea{min-height:360px}@media(max-width:820px){.work-columns{grid-template-columns:1fr;gap:16px;margin-top:16px}}
</style>
</head>
<body>
<main>
<header><h1>일일업무일지 생성기</h1></header>
<div class="inspection-columns">
<section class="card" aria-labelledby="list-heading">
<h2 id="list-heading"><span class="step">1</span>위험예지훈련</h2>
<div id="notice" role="alert" hidden></div>
<div class="bar training-toolbar"><label class="field" for="category"><span>분류</span><select id="category"><option>전체</option><option selected>일상</option><option>MCC</option><option>3개월</option><option>6개월</option><option>1년</option><option>수전선로</option></select></label></div>
<div class="table-wrap"><table><thead><tr><th scope="col">분류</th><th scope="col">위험예지훈련</th><th scope="col">사용 횟수</th></tr></thead><tbody id="items"></tbody></table></div>
<div id="risk-selected"></div>
</section>
<section class="card" aria-labelledby="inspection-heading">
<h2 id="inspection-heading"><span class="step">2</span>기간별 안전점검</h2>
<div id="inspections">
<div class="bar inspection-toolbar"><label class="field" for="inspection-category"><span>점검 종류</span><select id="inspection-category"></select></label><label class="field" for="inspection-start"><span>시작일</span><input type="date" id="inspection-start"></label><label class="field" for="inspection-end"><span>종료일</span><input type="date" id="inspection-end"></label></div>
<div class="table-wrap"><table><thead><tr><th scope="col">번호</th><th scope="col">안전점검 항목</th><th scope="col">사용 횟수</th></tr></thead><tbody id="inspection-items"></tbody></table></div>
<div id="inspection-selected"></div>
</div>
<p id="inspection-status" role="status" aria-live="polite"></p>
</section>
</div>
<div class="work-columns">
<section class="card" aria-labelledby="misc-heading">
<h2 id="misc-heading"><span class="step">3</span>기타업무</h2>
<div id="misc-items" role="group" aria-label="기타업무 선택"></div>
<div id="misc-selected"></div><p id="misc-status" role="status" aria-live="polite"></p>
</section>
<section class="card" aria-labelledby="output-heading"><h2 id="output-heading"><span class="step">4</span>업무일지</h2>
<textarea id="output" aria-label="업무일지 본문"></textarea>
<div class="actions"><button id="copy" disabled>복사</button><span id="status" role="status" aria-live="polite"></span></div>
</section>
</div>
</main>
<script>
'use strict';
const DATA = [[1, "일상", "단자대 볼트 조임시 돌출부에 의한 긁힘", "적절한 공구 사용, 작업전 안전교육, 안전모, 절연장갑 착용"], [2, "일상", "분전반 쇄정", "모든 작업후 및 일상점검 시 분전반 쇄정확인 철저"], [3, "일상", "전기,기계기구를 이용한 작업시 각종 안전사고", "안전화, 안전모 착용, 작업전 안전교육, 보안경 착용, 그라인더·고속절단기 작업안전수칙 준수"], [4, "일상", "조작반 오조작에 의한 전원 투입", "작업 전 안전교육, 작업 전 계통 숙지, 작업중 표지판 부착, 작업안전수칙 준수"], [5, "일상", "모선,케이블헤드, 볼트 등 돌출부 충돌", "작업전 안전교육, 안전모, 절연장갑 착용, 전방주시 철저"], [6, "일상", "진공 인터럽터 절연불량으로 인한 가압", "작업전 안전교육, 절연장갑 및 절연화 착용, 작업개소 전원차단 및 검전 실시, 절연상태 확인, 작업안전수칙 준수"], [7, "일상", "교육훈련 및 절차 미준수", "직무교육 실시, 비상대응훈련 실시 사고사례 교육 실시"], [8, "일상", "배전반내 공간 협소 및 돌출부로 인한 외상", "작업전 안전교육, 안전모, 절연장갑 착용, 전방주시 철저"], [9, "일상", "점검중 활선 충전부 접근 및 접촉", "작업전 안전교육, 작업개소 전원차단 및 작업중 표지설치, 절연장갑착용"], [10, "일상,3개월,6개월,1년", "분전반 내부작업시 날카로운 부위에 긁힘", "작업전 안전교육, 안전모, 절연화, 절연장갑 착용, 내부 돌출부 및 날카로운 부위 확인, 무리한 작업자세 금지"], [11, "일상,3개월,6개월,1년", "수동 및 자동 오취급에 의한 감전사고", "작업 전 안전교육, 안전작업을 위한 접지 설치, 작업안전수칙 준수"], [12, "일상,3개월,6개월,1년", "작업구간이 협소하여 구조물과 충돌 발생", "작업전 안전교육, 안전모 착용, 작업공간 및 주변 돌출부 확인, 이동 동선 확보, 전방주시 철저"], [13, "3개월", "평활용 콘덴서 잔류전하에 의한 전류접촉", "작업전 안전교육, 계통숙지, 절연장갑착용,접촉전방전실시"], [14, "3개월", "축전지 단자전압 측정시 단락으로 인한 화상", "작업전 안전교육, 절연보호덮개취부, 절연장갑착용, 전기안전수칙준수"], [15, "3개월,6개월,1년", "정류부, 축전지 등 충전부 활선 접촉", "작업전 안전교육, 절연보호덮개취부, 절연장갑착용,전기안전수칙준수"], [16, "6개월,1년", "인출작업중 차단기 중량으로 인한 손, 발 끼임", "작업전 안전교육, 안전모, 절연장갑, 절연화 착용, 중량물 취급 매뉴얼 숙지"], [17, "수전선로", "맨홀, 트라프 등 중량물에 의한 손, 발 끼임", "작업전 안전교육, 안전모, 안전화, 보호장갑 착용, 중량물 취급 안전수칙 준수, 2인 1조 작업 및 협착 주의"], [18, "MCC", "MCC반 주변설비에 부딪힘", "작업전안전교육 및 사전위험 요소 파악, 안전모착용"], [19, "MCC", "MCC반 미 쇄정", "MCC반 쇄정상태 확인, 잠금장치 파손여부 확인"], [20, "MCC", "MCC반 내부 점검시 날카로운 부위에 긁힘", "안전모, 절연장갑 착용, 내부 돌출부 및 날카로운 부위 확인, 작업안전수칙 준수"], [21, "MCC", "MCC 오동작으로 인한 전원 투입", "작업전 안전교육, 작업개소 전원차단 및 작업중 표지설치, 절연장갑 착용, 전기안전수칙준수"], [22, "MCC", "콘덴서 폭발", "안전모, 보안경, 절연장갑 착용, 콘덴서 외관 및 이상징후 확인, 잔류전하 방전 및 무전압 확인"], [23, "MCC", "콘덴서 잔류전하에 의한 전류 접촉", "작업전 안전교육, 작업개소 전원차단 및 작업중 표지설치, 절연장갑착용, 접촉전방전실시"]];
const STORAGE_KEY = 'jjya.usage-counts.v1';
const category = document.querySelector('#category');
const items = document.querySelector('#items');
const output = document.querySelector('#output');
const copyButton = document.querySelector('#copy');
const status = document.querySelector('#status');
const notice = document.querySelector('#notice');
let counts = {}, pending = null, busy = false;
function warn(message) { notice.hidden = false; notice.textContent = message; }
try {
  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved !== null) {
    const parsed = JSON.parse(saved);
    if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed) || Object.values(parsed).some(v => !Number.isSafeInteger(v) || v < 0)) throw new Error('invalid data');
    counts = parsed;
  }
} catch (error) {
  warn('사용 횟수를 읽을 수 없습니다. 브라우저의 저장소 설정을 확인하세요. 기존 기록 보호를 위해 확정을 중단합니다.');
  busy = true;
}
const keyFor = (group, id) => group === '전체' ? String(id) : `${group}|${id}`;
const usage = (group, id) => counts[keyFor(group, id)] || 0;
function render() {
  items.replaceChildren();
  DATA.filter(item => category.value === '전체' || item[1].split(',').includes(category.value)).forEach(item => {
    const row = document.createElement('tr');
    if (pending && pending.id === item[0] && pending.category === category.value) row.className = 'selected';
    const group = document.createElement('td'); group.textContent = item[1];
    const risk = document.createElement('td');
    const button = document.createElement('button'); button.className = 'item'; button.textContent = item[2]; button.addEventListener('click', () => generate(item)); risk.append(button);
    const count = document.createElement('td'); count.textContent = `${usage(category.value, item[0])}회`;
    row.append(group, risk, count); items.append(row);
  });
  const selected = document.querySelector('#risk-selected'); selected.replaceChildren();
  if (pending) {
    const chip = document.createElement('span'); chip.className = 'selection-chip';
    const text = document.createElement('span'); text.textContent = DATA.find(item => item[0] === pending.id)[2];
    const remove = document.createElement('button'); remove.type = 'button'; remove.className = 'remove-selection';
    remove.textContent = '×'; remove.title = '선택 해제'; remove.setAttribute('aria-label', '위험예지훈련 선택 해제');
    remove.addEventListener('click', clearRiskSelection);
    chip.append(text,remove); selected.append(chip);
  }
}
