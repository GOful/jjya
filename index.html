[hidden]{display:none!important}.workspace{border:0;padding:0;margin:0;min-width:0}.copy-meta{font-size:12px;color:#6b7c89;line-height:1.6;margin:-12px 0 20px}.copy-meta:has(#last-copied:empty):has(#cloud-status:empty){display:none}#cloud-status:empty{display:none}#cloud-status{color:#a1432e;margin:8px 0 0}

<body>
<main>
<header><h1>일일업무일지 생성기</h1></header>
<div class="team-tabs" role="group" aria-label="조 선택"><button type="button" data-team="갑조" aria-pressed="true">갑조</button><button type="button" data-team="을조" aria-pressed="false">을조</button><button type="button" data-team="병조" aria-pressed="false">병조</button></div>
<div class="copy-meta"><span id="last-copied"></span><p id="cloud-status" role="status" aria-live="polite"></p></div>
<fieldset id="workspace" class="workspace">
<div class="inspection-columns">
<section class="card" aria-labelledby="list-heading">
<h2 id="list-heading"><span class="step">1</span>위험예지훈련<button type="button" class="count-edit-toggle" aria-pressed="false">횟수 수정</button><button type="button" id="edit-training" class="content-edit-button">내용 수정</button></h2>
<div id="notice" role="alert" hidden></div>
<div class="bar training-toolbar"><label class="field" for="category"><span>분류</span><select id="category"><option>전체</option><option selected>일상</option><option>MCC</option><option>3개월</option><option>6개월</option><option>1년</option><option>수전선로</option></select></label></div>
<div class="table-wrap"><table><thead><tr><th scope="col">분류</th><th scope="col">위험예지훈련</th><th scope="col">사용 횟수</th></tr></thead><tbody id="items"></tbody></table></div>
<div id="risk-selected"></div>
</section>
<section class="card" aria-labelledby="inspection-heading">
<h2 id="inspection-heading"><span class="step">2</span>기간별 안전점검<button type="button" class="count-edit-toggle" aria-pressed="false">횟수 수정</button></h2>
<div id="inspections">
<div class="bar inspection-toolbar"><label class="field" for="inspection-category"><span>점검 종류</span><select id="inspection-category"></select></label><label class="field" for="inspection-start"><span>시작일</span><input type="date" id="inspection-start"></label><label class="field" for="inspection-end"><span>종료일</span><input type="date" id="inspection-end"></label></div>
<div class="table-wrap"><table><thead><tr><th scope="col">번호</th><th scope="col">안전점검 항목</th><th scope="col">사용 횟수</th></tr></thead><tbody id="inspection-items"></tbody></table></div>
<div id="inspection-selected"></div>
</div>
<p id="inspection-status" role="status" aria-live="polite"></p>
</section>
</div>
<div class="work-columns">
<section class="card" aria-labelledby="misc-heading">
<h2 id="misc-heading"><span class="step">3</span>기타업무</h2>
<div id="misc-items" role="group" aria-label="기타업무 선택"></div>
<div id="misc-selected"></div><p id="misc-status" role="status" aria-live="polite"></p>
</section>
<section class="card" aria-labelledby="output-heading"><h2 id="output-heading"><span class="step">4</span>업무일지</h2>
<textarea id="output" aria-label="업무일지 본문"></textarea>
<div class="actions"><button id="copy" disabled>복사</button><span id="status" role="status" aria-live="polite"></span></div>
</section>
</div>
</fieldset>

<dialog id="training-editor" aria-labelledby="training-editor-heading">
<form id="training-edit-form">
<h2 id="training-editor-heading">위험예지훈련 내용 수정</h2>
<p class="editor-scope">갑조 · 을조 · 병조 공통</p>
<label class="field" for="training-edit-item"><span>항목</span><select id="training-edit-item" required></select></label>
<label class="field" for="training-edit-risk"><span>위험예지훈련 내용</span><textarea id="training-edit-risk" required maxlength="5000"></textarea></label>
<label class="field" for="training-edit-rules"><span>작업 전 안전수칙</span><textarea id="training-edit-rules" required maxlength="10000"></textarea></label>
<p id="training-edit-status" role="status" aria-live="polite"></p>
<div class="editor-actions"><button type="submit" id="save-training">저장</button><button type="button" id="close-training-editor">닫기</button></div>
</form>
</dialog>
</main>
<script>
'use strict';
const DATA = [[1, "일상", "단자대 볼트 조임시 돌출부에 의한 긁힘", "적절한 공구 사용, 작업전 안전교육, 안전모, 절연장갑 착용"], [2, "일상", "분전반 쇄정", "모든 작업후 및 일상점검 시 분전반 쇄정확인 철저"], [3, "일상", "전기,기계기구를 이용한 작업시 각종 안전사고", "안전화, 안전모 착용, 작업전 안전교육, 보안경 착용, 그라인더·고속절단기 작업안전수칙 준수"], [4, "일상", "조작반 오조작에 의한 전원 투입", "작업 전 안전교육, 작업 전 계통 숙지, 작업중 표지판 부착, 작업안전수칙 준수"], [5, "일상", "모선,케이블헤드, 볼트 등 돌출부 충돌", "작업전 안전교육, 안전모, 절연장갑 착용, 전방주시 철저"], [6, "일상", "진공 인터럽터 절연불량으로 인한 가압", "작업전 안전교육, 절연장갑 및 절연화 착용, 작업개소 전원차단 및 검전 실시, 절연상태 확인, 작업안전수칙 준수"], [7, "일상", "교육훈련 및 절차 미준수", "직무교육 실시, 비상대응훈련 실시 사고사례 교육 실시"], [8, "일상", "배전반내 공간 협소 및 돌출부로 인한 외상", "작업전 안전교육, 안전모, 절연장갑 착용, 전방주시 철저"], [9, "일상", "점검중 활선 충전부 접근 및 접촉", "작업전 안전교육, 작업개소 전원차단 및 작업중 표지설치, 절연장갑착용"], [10, "일상,3개월,6개월,1년", "분전반 내부작업시 날카로운 부위에 긁힘", "작업전 안전교육, 안전모, 절연화, 절연장갑 착용, 내부 돌출부 및 날카로운 부위 확인, 무리한 작업자세 금지"], [11, "일상,3개월,6개월,1년", "수동 및 자동 오취급에 의한 감전사고", "작업 전 안전교육, 안전작업을 위한 접지 설치, 작업안전수칙 준수"], [12, "일상,3개월,6개월,1년", "작업구간이 협소하여 구조물과 충돌 발생", "작업전 안전교육, 안전모 착용, 작업공간 및 주변 돌출부 확인, 이동 동선 확보, 전방주시 철저"], [13, "3개월", "평활용 콘덴서 잔류전하에 의한 전류접촉", "작업전 안전교육, 계통숙지, 절연장갑착용,접촉전방전실시"], [14, "3개월", "축전지 단자전압 측정시 단락으로 인한 화상", "작업전 안전교육, 절연보호덮개취부, 절연장갑착용, 전기안전수칙준수"], [15, "3개월,6개월,1년", "정류부, 축전지 등 충전부 활선 접촉", "작업전 안전교육, 절연보호덮개취부, 절연장갑착용,전기안전수칙준수"], [16, "6개월,1년", "인출작업중 차단기 중량으로 인한 손, 발 끼임", "작업전 안전교육, 안전모, 절연장갑, 절연화 착용, 중량물 취급 매뉴얼 숙지"], [17, "수전선로", "맨홀, 트라프 등 중량물에 의한 손, 발 끼임", "작업전 안전교육, 안전모, 안전화, 보호장갑 착용, 중량물 취급 안전수칙 준수, 2인 1조 작업 및 협착 주의"], [18, "MCC", "MCC반 주변설비에 부딪힘", "작업전안전교육 및 사전위험 요소 파악, 안전모착용"], [19, "MCC", "MCC반 미 쇄정", "MCC반 쇄정상태 확인, 잠금장치 파손여부 확인"], [20, "MCC", "MCC반 내부 점검시 날카로운 부위에 긁힘", "안전모, 절연장갑 착용, 내부 돌출부 및 날카로운 부위 확인, 작업안전수칙 준수"], [21, "MCC", "MCC 오동작으로 인한 전원 투입", "작업전 안전교육, 작업개소 전원차단 및 작업중 표지설치, 절연장갑 착용, 전기안전수칙준수"], [22, "MCC", "콘덴서 폭발", "안전모, 보안경, 절연장갑 착용, 콘덴서 외관 및 이상징후 확인, 잔류전하 방전 및 무전압 확인"], [23, "MCC", "콘덴서 잔류전하에 의한 전류 접촉", "작업전 안전교육, 작업개소 전원차단 및 작업중 표지설치, 절연장갑착용, 접촉전방전실시"]];
let activeTeam = '갑조';
try { const last = localStorage.getItem('jjya.last-team'); if(['갑조','을조','병조'].includes(last)) activeTeam=last; } catch (_) {}
const STORAGE_KEY = 'jjya.usage-counts.v1';
const countsStorageKey = () => activeTeam==='갑조' ? STORAGE_KEY : `${STORAGE_KEY}:${activeTeam}`;
const teamDrafts = new Map();
let countEditing = false;
const countEditOrders = new Map(), adjustmentRetries = new Map();
const category = document.querySelector('#category');
const items = document.querySelector('#items');
const output = document.querySelector('#output');
const copyButton = document.querySelector('#copy');
const status = document.querySelector('#status');
const notice = document.querySelector('#notice');
let counts = {}, pending = null, busy = false;
const shared = window.SharedStore;
let activeLogId = crypto.randomUUID(), activeLogVersion = 0, dirty = false, cloudWorking = false;
function warn(message) { notice.hidden = false; notice.textContent = message; }
try {
  const saved = window.SharedStore?.enabled ? null : localStorage.getItem(countsStorageKey());

  output.value = `* 업무 인수인계 및 업무분장, 안전교육
* 근골격계질환 대비 스트레칭 실시
${insertedOffice}* 위험예지훈련 실시(${item[2]})
  - 작업 전 : ${item[3]}
${inspection}${insertedMisc}* 위험예지훈련 실시(${item[2]})
  - 작업 후 : 특이사항 없음
* 사무실 정리정돈 및 업무 인수인계`;
  copyButton.disabled = busy;
  copyButton.textContent = '복사';
  status.textContent = `미확정 | ${pending.category} | 현재 사용 횟수: ${usage(pending.category, pending.id)}회`;
  dirty = true;
  render();
}
function clearRiskSelection() {
  if (copyButton.dataset.copying) return;
  insertedMisc = ''; insertedOffice = ''; miscStatus.textContent = '';
  insertedInspection = ''; appliedInspections = {}; pending = null; output.value = ''; copyButton.disabled = true;
  copyButton.textContent = '복사';
  status.textContent = ''; inspectionStatus.textContent = '';
  render();
}
category.addEventListener('change', clearRiskSelection);
async function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) {
    try { await navigator.clipboard.writeText(text); return; } catch (_) { /* Try local-file fallback. */ }
  }
  output.focus(); output.select();
  if (!document.execCommand('copy')) throw new Error('clipboard unavailable');
}
copyButton.addEventListener('click', async () => {
  if (busy || cloudWorking || !pending || !output.value.trim() || (shared?.enabled && !currentUser)) return;
  const selected = pending;
  const inspectionControls = [...document.querySelectorAll('#inspections button, #inspections input, #inspections select, #misc-items button, #misc-selected button, .team-tabs button, .count-edit-toggle, .adjust-count, #edit-training')];
  inspectionControls.forEach(control => control.disabled = true);
  busy = true; copyButton.disabled = true; copyButton.dataset.copying = 'true'; category.disabled = true; output.readOnly = true;
  let clipboardDone = false;
  try {
    await copyText(output.value); clipboardDone = true;
    const keys = Object.entries(appliedInspections).map(([i,j]) => inspectionKey(i,j));
    if (shared?.enabled) {
      const result = await shared.save({id:activeLogId,version:activeLogVersion,body:output.value,state:captureState(),team:activeTeam,keys:[keyFor(selected.category,selected.id),...keys]});
      activeLogVersion = result.version; counts = result.counts; dirty = false;
      selected.confirmed = true;
      render(); renderInspections();
      status.textContent = '복사 완료';
      setLastCopied(result.updated_at); cloudMessage('');
      return;
    }
    const newKeys = keys.filter(key => !selected.countedInspections.has(key));
    if (!selected.confirmed || newKeys.length) {
      const next = {...counts};
      if (!selected.confirmed) {
        const key = keyFor(selected.category, selected.id); next[key] = (next[key] || 0) + 1;
      }
      for (const key of newKeys) next[key] = (next[key] || 0) + 1;
      try { localStorage.setItem(countsStorageKey(), JSON.stringify(next)); }
      catch (_) { status.textContent = '복사는 완료했지만 사용 횟수를 저장하지 못했습니다. 저장소 설정을 확인한 후 다시 시도하세요.'; return; }
      counts = next; selected.confirmed = true;
      newKeys.forEach(key => selected.countedInspections.add(key));
    }
    render(); renderInspections(); copyButton.textContent = '복사';
    status.textContent = `복사 및 확정 완료 | ${selected.category} | 사용 횟수: ${usage(selected.category, selected.id)}회`;
  } catch (error) {
    if (shared?.enabled && clipboardDone) { cloudMessage(friendlyError(error, '복사는 완료했지만 공유 저장에 실패했습니다.')); return; }
    status.textContent = '자동 복사에 실패했습니다. 본문을 직접 복사하거나 브라우저의 클립보드 권한을 확인하고 다시 시도하세요. 사용 횟수는 증가하지 않았습니다.';
  } finally {
    inspectionControls.forEach(control => control.disabled = false);
    busy = false; render();renderInspections();updateTeamTabs(); copyButton.disabled = !pending || Boolean(shared?.enabled && !currentUser); delete copyButton.dataset.copying; category.disabled = false; output.readOnly = false;
  }
});
let currentUser = null;
const cloudStatus = document.querySelector('#cloud-status');
const workspace = document.querySelector('#workspace');
function cloudMessage(message) { cloudStatus.textContent = message; }
function formatTime(value) { return new Date(value).toLocaleString('ko-KR',{timeZone:'Asia/Seoul'}); }
function setLastCopied(value) { document.querySelector('#last-copied').textContent = value ? `최근 복사 · ${formatTime(value)}` : ''; }
function friendlyError(error, fallback = '요청을 완료하지 못했습니다.') {
  if (error.message?.includes('CONTENT_EDIT_MIGRATION_REQUIRED')) return '점검 내용 테이블 전환 SQL을 먼저 실행해 주세요.';
  if (error.message?.includes('CONTENT_VERSION_CONFLICT')) return '다른 사람이 이 항목을 먼저 수정했습니다. 입력 내용을 따로 복사한 후 창을 닫고 다시 열어주세요.';
  if (error.message?.includes('COUNT_EDIT_MIGRATION_REQUIRED')) return '횟수 수정 설정 SQL을 먼저 실행해 주세요.';
  if (error.message?.includes('TEAM_MIGRATION_REQUIRED')) return '조별 집계 설정 SQL을 먼저 실행해 주세요.';
  if (error.message?.includes('VERSION_CONFLICT')) return '다른 사람이 먼저 수정했습니다. 현재 내용을 따로 복사해 둔 뒤 새로고침하세요.';
  if (error.message?.includes('ANONYMOUS_AUTH_REQUIRED')) return '공유 연결을 다시 시도하세요.';
  if ([401,403].includes(error.status)) return '익명 접속 설정을 확인하고 새로고침하세요.';
  return fallback + ' 연결 설정를 확인하고 다시 시도하세요.';
}
function captureState() {
  return {schemaVersion:1,team:activeTeam,category:category.value,inspectionCategory:inspectionCategory.value,
    pending:pending ? {id:pending.id,category:pending.category,riskText:pending.riskText,confirmed:pending.confirmed} : null,
    inspectionSelections:{...inspectionSelections},appliedInspections:{...appliedInspections},
    inspectionPeriods:inspectionPeriods.map(value=>({...value})),miscSelections:[...miscSelections],
    insertedInspection,insertedMisc,insertedOffice};
}
function validState(state) {
  const groups = [...category.options].map(option=>option.value);
  const validSelections = selection => selection && typeof selection==='object' && !Array.isArray(selection) &&
    Object.entries(selection).every(([i,j])=>INSPECTIONS[i] && Number.isInteger(j) && j>=0 && j<INSPECTIONS[i][2].length);
  return state?.schemaVersion===1 && groups.includes(state.category) && state.pending &&
    (state.pending.riskText===undefined || typeof state.pending.riskText==='string') &&
    DATA.some(item=>item[0]===state.pending.id) && groups.includes(state.pending.category) &&
    Number.isInteger(Number(state.inspectionCategory)) && INSPECTIONS[Number(state.inspectionCategory)] &&
    validSelections(state.inspectionSelections) && validSelections(state.appliedInspections) &&
    Array.isArray(state.inspectionPeriods) && state.inspectionPeriods.length===INSPECTIONS.length &&
    state.inspectionPeriods.every(period=>period && ['start','end'].every(key=>typeof period[key]==='string' && (!period[key] || /^\d{4}-\d{2}-\d{2}$/.test(period[key])))) &&
    Array.isArray(state.miscSelections) && state.miscSelections.every(i=>Number.isInteger(i) && MISC_TASKS[i]) &&
    typeof state.insertedInspection==='string' && typeof state.insertedMisc==='string' && (state.insertedOffice===undefined || typeof state.insertedOffice==='string');
}
function validateCatalog(data) {
  if (!data || !Array.isArray(data.training) || !Array.isArray(data.inspections) || !Array.isArray(data.misc)) throw new Error('INVALID_CATALOG');
  if (data.training.length!==DATA.length || data.inspections.length!==INSPECTIONS.length || ![6,7].includes(data.misc.length)) throw new Error('INVALID_CATALOG');
  if (!data.training.every((item,i)=>Array.isArray(item)&&item.length===4&&item[0]===DATA[i][0]&&item.slice(1).every(v=>typeof v==='string'&&v.trim()))) throw new Error('INVALID_CATALOG');
  if (!data.inspections.every((group,i)=>Array.isArray(group)&&group.length===3&&typeof group[0]==='string'&&typeof group[1]==='string'&&Array.isArray(group[2])&&group[2].length===INSPECTIONS[i][2].length&&group[2].every(v=>typeof v==='string'&&v.trim()))) throw new Error('INVALID_CATALOG');
  if (!data.misc.every(item=>Array.isArray(item)&&item.length===2&&item.every(v=>typeof v==='string'&&v.trim()))) throw new Error('INVALID_CATALOG');
}
function applyCatalog(data) {
  validateCatalog(data);
  DATA.splice(0,DATA.length,...data.training);
  INSPECTIONS.splice(0,INSPECTIONS.length,...data.inspections);
  MISC_TASKS.splice(0,MISC_TASKS.length,...data.misc, ...(data.misc.length===6 ? [[...DEFAULT_OFFICE_TASK]] : []));
  [...inspectionCategory.options].forEach((option,i)=>option.textContent=INSPECTIONS[i][0]);
  buildMisc(); render(); renderInspections();
}
function restoreLog(log) {
  const state=log.state;
  if (!validState(state) || (log.team && log.team!==activeTeam) || (state.team && state.team!==activeTeam)) throw new Error('INVALID_STATE');
  category.value=state.category; inspectionCategory.value=state.inspectionCategory;
  const previousRiskLine=log.body.split('\n').find(line=>line.startsWith('* 위험예지훈련 실시(')&&line.endsWith(')'));
  pending={...state.pending,riskText:state.pending.riskText || (previousRiskLine ? previousRiskLine.slice('* 위험예지훈련 실시('.length,-1) : DATA.find(item=>item[0]===state.pending.id)[2]),countedInspections:new Set()};
  inspectionSelections={...state.inspectionSelections};appliedInspections={...state.appliedInspections};
  state.inspectionPeriods.forEach((period,i)=>inspectionPeriods[i]={...period});
  miscSelections=new Set(state.miscSelections);insertedInspection=state.insertedInspection;insertedMisc=state.insertedMisc;insertedOffice=state.insertedOffice || '';
  activeLogId=log.id;activeLogVersion=log.version;output.value=log.body;dirty=false;
  render();renderInspections();renderMisc();copyButton.disabled=false;status.textContent='';
  setLastCopied(log.updated_at);
}
async function cloudAction(action) {
  if(cloudWorking || busy) return;
  cloudWorking=true;workspace.disabled=true;updateTeamTabs();
  try {await action();} catch(error) {cloudMessage(friendlyError(error));}
  finally {cloudWorking=false;workspace.disabled=Boolean(shared?.enabled&&!currentUser);updateTeamTabs();}
}
function updateTeamTabs() {
  document.querySelectorAll('[data-team]').forEach(button => {
    button.setAttribute('aria-pressed', String(button.dataset.team===activeTeam));
    button.disabled = busy || cloudWorking || Boolean(shared?.enabled && (!currentUser || (!shared.teamsReady && button.dataset.team!=='갑조')));
  });
}
function resetTeamSelection() {
  clearRiskSelection();inspectionSelections={};appliedInspections={};miscSelections=new Set();insertedMisc='';insertedOffice='';insertedInspection='';
  inspectionPeriods.forEach((_,i)=>inspectionPeriods[i]={start:'',end:''});
  activeLogId=crypto.randomUUID();activeLogVersion=0;dirty=false;setLastCopied(null);renderInspections();renderMisc();
}
async function loadTeam(team) {
  const snapshot=await shared.snapshot(team);
  const copied=snapshot.copied;
  applyCatalog(snapshot.catalog.data);
  activeTeam=team;counts=snapshot.counts;countEditOrders.clear();resetTeamSelection();
  const draft=teamDrafts.get(team);
  if(draft){restoreLog(draft);dirty=true;setLastCopied(copied?.updated_at);}
  else if(copied)restoreLog(copied);
  render();renderInspections();
  try{localStorage.setItem('jjya.last-team',team);}catch(_){}
  cloudMessage(shared.teamsReady ? '' : '조별 집계 설정 SQL 적용 전입니다. 기존 기록은 갑조로 표시합니다.');
}
async function connect(user) {
  await loadTeam(activeTeam);currentUser=user;
}
document.querySelectorAll('[data-team]').forEach(button=>button.addEventListener('click',()=>{
  const team=button.dataset.team;if(team===activeTeam||busy||cloudWorking)return;
  if(shared?.enabled){
    if(pending&&dirty)teamDrafts.set(activeTeam,{id:activeLogId,version:activeLogVersion,body:output.value,state:captureState()});
    else teamDrafts.delete(activeTeam);
    cloudAction(async()=>loadTeam(team));
  } else {
    activeTeam=team;resetTeamSelection();
    try{counts=JSON.parse(localStorage.getItem(countsStorageKey())||'{}');localStorage.setItem('jjya.last-team',team);}catch(_){counts={};}
    render();renderInspections();updateTeamTabs();
  }
}));
updateTeamTabs();
const trainingEditor=document.querySelector('#training-editor');
const trainingEditSelect=document.querySelector('#training-edit-item');
const trainingEditRisk=document.querySelector('#training-edit-risk');
const trainingEditRules=document.querySelector('#training-edit-rules');
const trainingEditStatus=document.querySelector('#training-edit-status');
let trainingOriginals=[],trainingSaving=false;
const trainingDrafts=new Map();
function showTrainingFields(){
  const id=Number(trainingEditSelect.value);
  const original=trainingOriginals.find(item=>item[0]===id);
  const draft=trainingDrafts.get(id);
  trainingEditRisk.value=draft?.riskText ?? original[2];trainingEditRules.value=draft?.safetyRules ?? original[3];trainingEditStatus.textContent='';
}
[trainingEditRisk,trainingEditRules].forEach(input=>input.addEventListener('input',()=>{
  trainingDrafts.set(Number(trainingEditSelect.value),{riskText:trainingEditRisk.value,safetyRules:trainingEditRules.value});
}));
trainingEditSelect.addEventListener('change',showTrainingFields);
document.querySelector('#edit-training').addEventListener('click',()=>{
  if(!shared?.enabled){cloudMessage('공통 내용 수정은 DB 연결 상태에서 사용할 수 있습니다.');return;}
  cloudAction(async()=>{
    const catalog=await shared.readCatalog({force:true});validateCatalog(catalog.data);
    trainingOriginals=structuredClone(catalog.data.training);trainingDrafts.clear();trainingEditSelect.replaceChildren();
    trainingOriginals.forEach(item=>{
      const option=document.createElement('option');option.value=item[0];option.textContent=`${item[0]}. ${item[2]} (${item[1]})`;trainingEditSelect.append(option);
    });
    const preferred=pending?.id ?? DATA.find(item=>category.value==='전체'||item[1].split(',').includes(category.value))?.[0];
    if(preferred)trainingEditSelect.value=preferred;
    showTrainingFields();trainingEditor.showModal();
  });
});
document.querySelector('#close-training-editor').addEventListener('click',()=>{if(!trainingSaving)trainingEditor.close();});
trainingEditor.addEventListener('cancel',event=>{if(trainingSaving)event.preventDefault();});
document.querySelector('#training-edit-form').addEventListener('submit',async event=>{
  event.preventDefault();if(trainingSaving)return;
  const original=trainingOriginals.find(item=>item[0]===Number(trainingEditSelect.value));
  const riskText=trainingEditRisk.value.trim(),safetyRules=trainingEditRules.value.trim();
  if(!riskText||!safetyRules){trainingEditStatus.textContent='내용과 안전수칙을 입력하세요.';return;}
  trainingSaving=true;
  const controls=[...trainingEditor.querySelectorAll('button,select,textarea')];controls.forEach(control=>control.disabled=true);
  trainingEditStatus.textContent='저장 중…';
  try{
    const saved=await shared.updateTraining({id:original[0],riskText:original[2],safetyRules:original[3]},riskText,safetyRules);
    const item=DATA.find(item=>item[0]===saved.id);
    if(pending?.id===saved.id&&!pending.riskText)pending.riskText=item[2];
    item[2]=saved.risk_text;item[3]=saved.safety_rules;
    original[2]=saved.risk_text;original[3]=saved.safety_rules;trainingDrafts.delete(saved.id);
    trainingEditRisk.value=saved.risk_text;trainingEditRules.value=saved.safety_rules;
    trainingEditSelect.selectedOptions[0].textContent=`${original[0]}. ${original[2]} (${original[1]})`;
    render();trainingEditStatus.textContent='세 조 공통으로 저장했습니다. 새로 생성하는 일지에 적용됩니다.';
  }catch(error){trainingEditStatus.textContent=friendlyError(error,'내용을 저장하지 못했습니다.');}
  finally{trainingSaving=false;controls.forEach(control=>control.disabled=false);}
});
workspace.addEventListener('input',()=>{if(shared?.enabled)dirty=true;});
workspace.addEventListener('click',event=>{if(shared?.enabled&&event.target.closest('.item,.remove-selection,#misc-items button'))dirty=true;});
window.addEventListener('beforeunload',event=>{if(shared?.enabled&&dirty){event.preventDefault();event.returnValue='';}});
if(shared?.enabled){
  workspace.disabled=true;
  cloudAction(async()=>{await connect(await shared.start());});
}

render();
</script>
